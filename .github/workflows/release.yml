name: Build Minimal VLESS+WS (linux amd64/arm64)

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset_name: linux-64
          - goos: linux
            goarch: arm64
            asset_name: linux-arm64-v8a
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Show build info
        run: |
          echo "GOOS=$GOOS GOARCH=$GOARCH"
          go version
          git describe --always --dirty || true

      - name: Build minimal xray (VLESS + WS only)
        run: |
          mkdir -p build_assets
          COMMID=$(git describe --always --dirty 2>/dev/null || echo "unknown")
          echo "Building with commit: $COMMID"

          go build -trimpath -buildvcs=false \
            -ldflags="-X github.com/xtls/xray-core/core.build=${COMMID} -s -w -buildid=" \
            -o build_assets/xray \
            ./main

          ls -lh build_assets/xray
          file build_assets/xray || true
          ./build_assets/xray version || true

      - name: Optional UPX compress
        continue-on-error: true
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq upx-ucl
          upx --best --lzma build_assets/xray || upx --best build_assets/xray || true
          ls -lh build_assets/xray

      - name: Copy LICENSE
        run: |
          cp LICENSE build_assets/LICENSE || true
          cp README.md build_assets/README.md || true

      - name: Create ZIP
        if: github.event_name == 'release'
        run: |
          pushd build_assets
          zip -9 ../Xray-${{ matrix.asset_name }}.zip xray LICENSE README.md 2>/dev/null || zip -9 ../Xray-${{ matrix.asset_name }}.zip xray
          popd
          ls -lh Xray-*.zip
          for m in md5 sha1 sha256 sha512; do
            openssl dgst -$m Xray-${{ matrix.asset_name }}.zip | sed 's/([^)]*)//g' >> Xray-${{ matrix.asset_name }}.zip.dgst
          done

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Xray-${{ matrix.asset_name }}.zip
            Xray-${{ matrix.asset_name }}.zip.dgst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xray-vless-ws-${{ matrix.asset_name }}
          path: build_assets/xray
          if-no-files-found: error
