name: Test Minimal VLESS+WS Build

on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  test-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    runs-on: ubuntu-latest
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      CGO_ENABLED: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          check-latest: true

      - name: Build minimal binary
        run: |
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w -buildid=" \
            -o xray-test \
            ./main
          ls -lh xray-test
          file xray-test || true

      - name: Version check (only on amd64 runner)
        if: matrix.goarch == 'amd64'
        run: |
          ./xray-test version
          echo "Build OK for ${{ matrix.goos }}/${{ matrix.goarch }}"

      - name: Upload test binary
        uses: actions/upload-artifact@v4
        with:
          name: test-xray-${{ matrix.goos }}-${{ matrix.goarch }}
          path: xray-test
          retention-days: 3
